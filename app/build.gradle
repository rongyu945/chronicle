plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// 签名口令不写在源码里：放在根目录 keystore.properties（该文件不进源码归档）
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.rongyu.shixuji'
    compileSdk 34

    defaultConfig {
        applicationId "com.rongyu.shixuji"
        minSdk 24
        targetSdk 34
        versionCode 77
        versionName "4.4.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile keystoreProps['storeFile'] ? file(keystoreProps['storeFile']) : file('../release.keystore')
            storePassword keystoreProps['storePassword'] ?: System.getenv("SHIXUJI_STORE_PASSWORD")
            keyAlias keystoreProps['keyAlias'] ?: 'shixuji'
            keyPassword keystoreProps['keyPassword'] ?: System.getenv("SHIXUJI_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
}

// 导出 Room schema，方便以后写迁移和做回归
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // 单元测试（纯逻辑：金额换算 / 日期计算）
    testImplementation 'junit:junit:4.13.2'
}
