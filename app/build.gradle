plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// 签名口令不写在源码里：放在根目录 keystore.properties（该文件不进源码归档）
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.rongyu.shixuji'
    compileSdk 34

    defaultConfig {
        applicationId "com.rongyu.shixuji"
        minSdk 24
        targetSdk 34
        versionCode 528
        versionName "5.2.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile keystoreProps['storeFile'] ? file(keystoreProps['storeFile']) : file('../release.keystore')
            storePassword keystoreProps['storePassword'] ?: System.getenv("SHIXUJI_STORE_PASSWORD")
            keyAlias keystoreProps['keyAlias'] ?: 'shixuji'
            keyPassword keystoreProps['keyPassword'] ?: System.getenv("SHIXUJI_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        // 统一周条组件（ui/motion）用 java.time.LocalDate 做日期几何：
        // minSdk 24 < 26，java.time 在 Android 8.0 以下不存在，必须开脱糖。
        // 顺带附带 DST 正确性：按「日历天数」而不是「毫秒差 ÷ 86400000」算天数差。
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
}

// 导出 Room schema，方便以后写迁移和做回归
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // FileProvider + ShareCompat（「分享备份」走系统分享面板）
    implementation 'androidx.core:core-ktx:1.13.1'

    // 单元测试（纯逻辑：金额换算 / 日期计算 / 周条几何 / 备份文件解析）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.0.21'
    // 备份解析（data/BackupCodec.kt）用 org.json：android.jar 里那份在 JVM 单测中是空壳
    // （所有方法都返回 null/抛 not mocked），拉一份真 jar 进来才能离线跑恢复逻辑的回归测试。
    testImplementation 'org.json:json:20240303'

    // java.time 脱糖（配合 compileOptions.coreLibraryDesugaringEnabled）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
